name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly tier, with the Windows jobs and Stress
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      node-versions: "[22, 24]"
      docs-files: |
        README.md
        docs
      renovate-sync: false
      test-shards: 4
      extra-commands: |
        pnpm run test:bench
      test-job: true
      setup-commands: |
        if [[ "$RUNNER_OS" == Windows ]]; then
          data=$(cygpath -w "$RUNNER_TEMP/mysql-data")
          mysqld --initialize-insecure --datadir="$data" > "$RUNNER_TEMP/mysqld-init.log" 2>&1 || { cat "$RUNNER_TEMP/mysqld-init.log"; exit 1; }
          nohup mysqld --datadir="$data" --bind-address=127.0.0.1 --port=3306 --innodb-flush-log-at-trx-commit=0 --sync-binlog=0 > "$RUNNER_TEMP/mysqld.log" 2>&1 &
          for _ in $(seq 300); do
            mysqladmin -uroot -h127.0.0.1 --silent ping > /dev/null 2>&1 && break
            sleep 0.2
          done
          if ! mysqladmin -uroot -h127.0.0.1 --silent ping > /dev/null 2>&1; then
            cat "$RUNNER_TEMP/mysqld.log"
            echo "::error::MySQL did not listen on 127.0.0.1:3306 within 60 seconds."
            exit 1
          fi
          cd "$RUNNER_TEMP"
          curl -sSfLO https://downloads.mysql.com/general/timezone_2026f_posix_sql.zip
          echo "24c99cb5660e659634311aa015a22e8a7d3f25caec2111b275289b07df7c1948  timezone_2026f_posix_sql.zip" | sha256sum -c --quiet
          unzip -q timezone_2026f_posix_sql.zip
          mysql -uroot -h127.0.0.1 mysql < timezone_2026f_posix_sql/timezone_posix.sql
          echo "MYSQL_TEST_URL=mysql://root@127.0.0.1:3306/mysql" >> "$GITHUB_ENV"
        fi
      affected-tests: true
      nightly: ${{ inputs.nightly == true }}
      formal-checks: |
        [
          {"skill": "formal-change-feed-delivery", "paths": ["src/dialect/mysql/capture.ts", "src/implementations/database/change-loop.ts", "src/implementations/database/feed-poll.ts", "src/implementations/database/feeds.ts", "src/implementations/database/reaper.ts", "src/implementations/database/sequencer.ts"]},
          {"skill": "formal-json-value-identity", "paths": ["src/dialect/mariadb/json-text.ts", "src/dialect/mariadb/numbers.ts", "src/dialect/mysql/flavour.ts", "src/dialect/mysql/sql-json-kinds.ts", "src/dialect/mysql/sql-json.ts", "src/implementations/database/grouped.ts", "src/implementations/database/join-key.ts", "src/implementations/database/ranked-key.ts", "src/implementations/database/stages-aggregate.ts", "src/implementations/database/stages-group.ts", "src/implementations/database/value-key.ts"]},
          {"skill": "formal-mariadb-read-warnings", "paths": ["src/connection.ts", "src/dialect/mariadb/index.ts", "src/dialect/mysql/capture.ts", "src/dialect/mysql/checked-rows.ts", "src/implementations/database/row-stream.ts", "src/warnings.ts"]},
          {"skill": "formal-merge-repeated-keys", "paths": ["src/dialect/mariadb/containers.ts", "src/dialect/mariadb/escaped-keys.ts", "src/dialect/mariadb/json-text.ts", "src/dialect/mysql/sql-last-members.ts", "src/implementations/database/member.ts", "src/implementations/database/paths.ts", "src/implementations/database/stages-object.ts"]},
          {"skill": "formal-pipeline-chains"},
          {"skill": "formal-unique-index-gate", "paths": ["src/connection.ts", "src/implementations/database/convergence.ts", "src/implementations/database/locks.ts", "src/implementations/database/migrate-indexes.ts", "src/implementations/database/migrate-tables.ts", "src/implementations/database/schema.ts", "src/implementations/database/unbuilt-unique.ts"]}
        ]
    permissions:
      contents: read
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
  verdict:
    needs: [ci, renovate-sync]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
